name: Mahajana Sampatha Auto Update

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_CREDENTIALS }}' > temoryFile.json

      - name: Run Mahajana Sampatha update
        env:
          GOOGLE_APPLICATION_CREDENTIALS: temoryFile.json
        run: python main.py
